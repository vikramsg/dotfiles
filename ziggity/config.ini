# Ziggity settings shared by every repository. Ziggity has no global config
# path of its own; it reads the file named by ZIGGITY_CONFIG, which
# ~/.zshenv and the Herdr popup point at ~/.config/ziggity/config.ini.

# Show changed files as a folder tree, as LazyGit does; ` toggles flat and tree.
show_file_tree = true

# Custom commands run without the output dialog; failures still open one.
command_output = silent

# Custom commands override built-in keys in every panel. Ziggity's own G only
# works in Commits and Branches, and its o opens the selected commit or branch
# on GitHub. G opens the current branch's pull request; o opens it too, or
# starts creating one when the branch has none.
#
# Ziggity blocks its UI until a custom command exits, and gh needs a GitHub API
# round trip first, so G runs in the background and discards its errors. o stays
# in the foreground so a failed create (for example on an unpushed branch) shows
# its error.
command.G = gh pr view --web >/dev/null 2>&1 &
command.o = gh pr view --web || gh pr create --web
