path = "~"
focus_tab = 1

# Use autossh instead of plain ssh for each interactive tab.
# AUTOSSH_POLL=30: detect dead child ssh process quickly (default is 600s).
# AUTOSSH_GATETIME=0: do not give up if first reconnect fails during Wi-Fi wake.
# -M 0: disable autossh monitor port and rely on SSH ServerAlive* settings.
# IMPORTANT: only one tab should own the shared local port forwards.
# Other tabs force-clear inherited forwards via -o ClearAllForwardings=yes.

[[tabs]]
name = "dotfiles"
command = "env AUTOSSH_POLL=30 AUTOSSH_GATETIME=0 /opt/homebrew/bin/autossh -M 0 vm-us.dotfiles"

[[tabs]]
name = "mx"
command = "env AUTOSSH_POLL=30 AUTOSSH_GATETIME=0 /opt/homebrew/bin/autossh -M 0 -o ClearAllForwardings=yes vm-us.mx"

[[tabs]]
name = "mx-worktree"
command = "env AUTOSSH_POLL=30 AUTOSSH_GATETIME=0 /opt/homebrew/bin/autossh -M 0 -o ClearAllForwardings=yes vm-us.mx-worktree"

[[tabs]]
name = "work-github"
command = "env AUTOSSH_POLL=30 AUTOSSH_GATETIME=0 /opt/homebrew/bin/autossh -M 0 -o ClearAllForwardings=yes vm-us.work-github"

[[tabs]]
name = "project"
command = "env AUTOSSH_POLL=30 AUTOSSH_GATETIME=0 /opt/homebrew/bin/autossh -M 0 -o ClearAllForwardings=yes vm-us.project"

[[tabs]]
name = "services"
command = "env AUTOSSH_POLL=30 AUTOSSH_GATETIME=0 /opt/homebrew/bin/autossh -M 0 -o ClearAllForwardings=yes vm-us.services"

[[tabs]]
name = "btop"
command = "env AUTOSSH_POLL=30 AUTOSSH_GATETIME=0 /opt/homebrew/bin/autossh -M 0 -o ClearAllForwardings=yes vm-us.btop"

[[tabs]]
name = "ports"
command = "tmux a -t port-forward"
