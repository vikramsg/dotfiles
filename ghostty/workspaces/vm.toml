path = "~"
focus_tab = 1

# Use autossh instead of plain ssh for each interactive tab.
# AUTOSSH_POLL=30: detect dead child ssh process quickly (default is 600s).
# AUTOSSH_GATETIME=0: do not give up if first reconnect fails during Wi-Fi wake.
# -M 0: disable autossh monitor port and rely on SSH ServerAlive* settings.

[[tabs]]
name = "dotfiles"
command = "env AUTOSSH_POLL=30 AUTOSSH_GATETIME=0 autossh -M 0 vm.dotfiles"

[[tabs]]
name = "knda"
command = "env AUTOSSH_POLL=30 AUTOSSH_GATETIME=0 autossh -M 0 vm.kunda"

[[tabs]]
name = "mx"
command = "env AUTOSSH_POLL=30 AUTOSSH_GATETIME=0 autossh -M 0 vm.mx"

[[tabs]]
name = "btop"
command = "env AUTOSSH_POLL=30 AUTOSSH_GATETIME=0 autossh -M 0 vm.btop"
