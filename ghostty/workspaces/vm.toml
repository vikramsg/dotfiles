path = "~"
focus_tab = 1

# Use autossh instead of plain ssh for each interactive tab.
# AUTOSSH_POLL=30: detect dead child ssh process quickly (default is 600s).
# AUTOSSH_GATETIME=0: do not give up if first reconnect fails during Wi-Fi wake.
# -M 0: disable autossh monitor port and rely on SSH ServerAlive* settings.
# IMPORTANT: only one tab should own SSH forwards (local ports or RemoteForward sockets).
# Other tabs force-clear inherited forwards via -o ClearAllForwardings=yes.
# Helper SSH commands must do the same, otherwise a short-lived session can clobber
# a live Unix-socket forward such as ~/.opener.sock and leave behind connection refused.

[[tabs]]
name = "dotfiles"
command = "env AUTOSSH_POLL=30 AUTOSSH_GATETIME=0 /opt/homebrew/bin/autossh -M 0 vm.dotfiles"

[[tabs]]
name = "mx"
command = "env AUTOSSH_POLL=30 AUTOSSH_GATETIME=0 /opt/homebrew/bin/autossh -M 0 -o ClearAllForwardings=yes vm.mx"

[[tabs]]
name = "mx-worktree"
command = "env AUTOSSH_POLL=30 AUTOSSH_GATETIME=0 /opt/homebrew/bin/autossh -M 0 -o ClearAllForwardings=yes vm.mx-worktree"

[[tabs]]
name = "orbio-github"
command = "env AUTOSSH_POLL=30 AUTOSSH_GATETIME=0 /opt/homebrew/bin/autossh -M 0 -o ClearAllForwardings=yes vm.orbio-github"

[[tabs]]
name = "knda"
command = "env AUTOSSH_POLL=30 AUTOSSH_GATETIME=0 /opt/homebrew/bin/autossh -M 0 -o ClearAllForwardings=yes vm.kunda"

[[tabs]]
name = "infra"
command = "env AUTOSSH_POLL=30 AUTOSSH_GATETIME=0 /opt/homebrew/bin/autossh -M 0 -o ClearAllForwardings=yes vm.infra"

[[tabs]]
name = "btop"
command = "env AUTOSSH_POLL=30 AUTOSSH_GATETIME=0 /opt/homebrew/bin/autossh -M 0 -o ClearAllForwardings=yes vm.btop"

[[tabs]]
name = "ports"
command = "uvx ssh-auto-forward vm"
