# Shortcut reference (prefix: Ctrl+Space)
# Ctrl+H / Ctrl+J / Ctrl+K / Ctrl+L: focus left / down / up / right
# prefix+q: reload configuration
# prefix+?: show help
# prefix+d: detach
# prefix+[: enter copy mode
# prefix+c: create a tab
# prefix+1..9: switch tabs
# prefix+Shift+1..9: focus agents
# prefix+p / prefix+n: previous / next tab
# prefix+$: rename the current tab
# prefix+" / prefix+%: stacked / side-by-side split
# prefix+x / prefix+z: close / zoom pane
# prefix+;: focus the last pane
# prefix+Shift+C: create a workspace
# prefix+h / prefix+l / prefix+k / prefix+j: resize left / right / down / up
# prefix+Shift+H/J/K/L: swap left / down / up / right
# prefix+g: open LazyGit popup
# prefix+e: open Yazi in a new tab
# prefix+Shift+S: open Screenshots in a Yazi tab
# prefix+v: pick and watch a Markdown file
# prefix+w: Open workspace picker
# prefix+Shift+T: open terminal popup
# prefix+Shift+D: open Hunk diff review popup
# prefix+Shift+G: open PR review tab
# prefix+f: open Snacks file picker
# prefix+Shift+O: append OpenCode and Vim project tabs

onboarding = false

[theme]
name = "tokyo-night"

[theme.custom]
accent = "#89b4fa"
sidebar_bg = "#20232b"
active_row_bg = "#24283b"
selection_bg = "#33467c"

[terminal]
default_shell = "/bin/zsh"
new_cwd = "follow"

[keys]
prefix = "ctrl+space"
reload_config = "prefix+q"
help = "prefix+?"
detach = "prefix+d"
copy_mode = "prefix+["
new_tab = "prefix+c"
switch_tab = "prefix+1..9"
focus_agent = "prefix+shift+1..9"
previous_tab = "prefix+p"
next_tab = "prefix+n"
goto = "prefix+s"
edit_scrollback = ""
rename_tab = "prefix+$"
close_pane = "prefix+x"
zoom = "prefix+z"
last_pane = "prefix+semicolon"
split_horizontal = 'prefix+"'
split_vertical = "prefix+%"
new_workspace = "prefix+shift+c"

# Match vim-tmux-navigator's spatial pane movement.
cycle_pane_previous = []
cycle_pane_next = []

# vim-herdr-navigation owns Ctrl+h/j/k/l through the plugin actions below.
# Prefix h/j/k/l remain reserved for the tmux-compatible resize commands.
focus_pane_left = ""
focus_pane_down = ""
focus_pane_up = ""
focus_pane_right = ""

swap_pane_left = "prefix+shift+h"
swap_pane_down = "prefix+shift+j"
swap_pane_up = "prefix+shift+k"
swap_pane_right = "prefix+shift+l"

[[keys.command]]
key = "ctrl+h"
type = "plugin_action"
command = "vim-herdr-navigation.left"
description = "navigate left (vim/herdr)"

[[keys.command]]
key = "ctrl+j"
type = "plugin_action"
command = "vim-herdr-navigation.down"
description = "navigate down (vim/herdr)"

[[keys.command]]
key = "ctrl+k"
type = "plugin_action"
command = "vim-herdr-navigation.up"
description = "navigate up (vim/herdr)"

[[keys.command]]
key = "ctrl+l"
type = "plugin_action"
command = "vim-herdr-navigation.right"
description = "navigate right (vim/herdr)"

[[keys.command]]
key = "prefix+h"
type = "shell"
command = '"$HERDR_BIN_PATH" pane resize --direction left --pane "$HERDR_ACTIVE_PANE_ID"'
description = "resize pane left"

[[keys.command]]
key = "prefix+l"
type = "shell"
command = '"$HERDR_BIN_PATH" pane resize --direction right --pane "$HERDR_ACTIVE_PANE_ID"'
description = "resize pane right"

[[keys.command]]
key = "prefix+k"
type = "shell"
command = '"$HERDR_BIN_PATH" pane resize --direction down --pane "$HERDR_ACTIVE_PANE_ID"'
description = "resize pane down"

[[keys.command]]
key = "prefix+j"
type = "shell"
command = '"$HERDR_BIN_PATH" pane resize --direction up --pane "$HERDR_ACTIVE_PANE_ID"'
description = "resize pane up"

# Custom terminal tool launchers.
[[keys.command]]
key = "prefix+g"
type = "popup"
command = "lazygit"
description = "open LazyGit popup"
width = "90%"
height = "90%"

[[keys.command]]
key = "prefix+e"
type = "shell"
command = '"$HERDR_BIN_PATH" tab create --workspace "$HERDR_ACTIVE_WORKSPACE_ID" --cwd "$HERDR_ACTIVE_PANE_CWD" --label Yazi --env TERM=xterm-kitty --env HERDR_START_YAZI=1 --focus'
description = "open Yazi in a new tab"

[[keys.command]]
key = "prefix+shift+s"
type = "shell"
command = 'response=$("$HERDR_BIN_PATH" tab create --workspace "$HERDR_ACTIVE_WORKSPACE_ID" --cwd "$HOME/Desktop/Screenshots" --label Screenshots --env TERM=xterm-kitty --env YAZI_CONFIG_HOME="$HOME/.config/yazi/profiles/screenshots" --focus) && pane_id=$(printf "%s\n" "$response" | jq -r ".result.root_pane.pane_id") && "$HERDR_BIN_PATH" pane run "$pane_id" "exec yazi"'
description = "open screenshots in Yazi"

[[keys.command]]
key = "prefix+v"
type = "popup"
command = "leaf --watch"
description = "open Markdown preview"
width = "90%"
height = "90%"

[[keys.command]]
key = "prefix+shift+t"
type = "popup"
command = 'exec "${SHELL:-/bin/zsh}"'
description = "open terminal popup"
width = "90%"
height = "90%"

[[keys.command]]
key = "prefix+shift+d"
type = "popup"
command = "exec /bin/zsh -dfc 'source \"$HOME/.zsh_script\"; hunk'"
description = "open Hunk diff review"
width = "90%"
height = "90%"

[[keys.command]]
key = "prefix+shift+g"
type = "shell"
command = '"$HERDR_BIN_PATH" tab create --workspace "$HERDR_ACTIVE_WORKSPACE_ID" --cwd "$HERDR_ACTIVE_PANE_CWD" --label Review --env HERDR_START_TUICR=1 --focus'
description = "open PR review in a new tab"

[[keys.command]]
key = "prefix+shift+o"
type = "shell"
command = 'project_cwd="$HERDR_ACTIVE_PANE_CWD" && response=$("$HERDR_BIN_PATH" tab create --workspace "$HERDR_ACTIVE_WORKSPACE_ID" --cwd "$project_cwd" --label OpenCode --no-focus) && opencode_tab=$(printf "%s\n" "$response" | jq -r ".result.tab.tab_id") && opencode_pane=$(printf "%s\n" "$response" | jq -r ".result.root_pane.pane_id") && "$HERDR_BIN_PATH" pane run "$opencode_pane" "exec opencode2" && response=$("$HERDR_BIN_PATH" tab create --workspace "$HERDR_ACTIVE_WORKSPACE_ID" --cwd "$project_cwd" --label nvim --no-focus) && vim_pane=$(printf "%s\n" "$response" | jq -r ".result.root_pane.pane_id") && "$HERDR_BIN_PATH" pane run "$vim_pane" "exec nvim ." && "$HERDR_BIN_PATH" tab focus "$opencode_tab"'
description = "append OpenCode and Vim project tabs"

[[keys.command]]
key = "prefix+f"
type = "shell"
command = 'config_file=$(readlink "$HOME/.config/herdr/config.toml") && zsh "$(dirname "$config_file")/snacks-picker.zsh"'
description = "open Snacks file picker"

[ui]
tab_bar_position = "top"
sidebar_width = 30
sidebar_min_width = 24
sidebar_max_width = 40
tab_bar_right = [
  { type = "zoom" },
  { type = "command", command = 'branch=$(git branch --show-current 2>/dev/null); test -n "$branch" && printf " %s\n" "$branch"', interval_seconds = 5, timeout_seconds = 2 },
  { type = "command", command = 'host=$(hostname -s); printf "󰒋 %s\n" "${host#dev-vm-}"', interval_seconds = 3600, timeout_seconds = 2 },
]
tab_bar_right_separator = "   "
pane_borders = true
pane_gaps = false
pane_scrollbars = false
mouse_capture = true
copy_on_select = true
confirm_close = true
prompt_new_tab_name = false

[ui.sidebar.spaces]
rows = [
  ["state_icon", { token = "workspace", fg = "#7aa2f7", bold = true }],
  [{ token = "$branch_label", fg = "#9ece6a", dim = true }],
]

[ui.sound]
enabled = false

[experimental]
kitty_graphics = true
