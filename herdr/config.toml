# Shortcut reference (prefix: Ctrl+Space)
# Ctrl+H / Ctrl+K: cycle to the previous pane
# Ctrl+J / Ctrl+L: cycle to the next pane
# prefix+q: reload configuration
# prefix+?: show help
# prefix+d: detach
# prefix+[: enter copy mode
# prefix+c: create a tab
# prefix+1..9: switch tabs
# prefix+p / prefix+n: previous / next tab
# prefix+Shift+R: rename the current tab
# prefix+" / prefix+%: stacked / side-by-side split
# prefix+x / prefix+z: close / zoom pane
# prefix+;: focus the last pane
# prefix+Shift+C: create a workspace
# prefix+h / prefix+l / prefix+k / prefix+j: resize left / right / down / up
# prefix+Shift+H/J/K/L: swap left / down / up / right
# prefix+g: open LazyGit popup
# prefix+e: open Yazi popup
# prefix+Shift+T: open terminal popup
# prefix+Shift+F: fuzzy find and edit a file

onboarding = false

[theme]
name = "tokyo-night"

[theme.custom]
accent = "#89b4fa"

[terminal]
default_shell = "/bin/zsh"
new_cwd = "follow"

[keys]
prefix = "ctrl+space"
reload_config = "prefix+q"
help = "prefix+?"
detach = "prefix+d"
copy_mode = "prefix+["
new_tab = "prefix+c"
switch_tab = "prefix+1..9"
previous_tab = "prefix+p"
next_tab = "prefix+n"
goto = "prefix+s"
edit_scrollback = ""
rename_tab = "prefix+shift+r"
close_pane = "prefix+x"
zoom = "prefix+z"
last_pane = "prefix+semicolon"
split_horizontal = 'prefix+"'
split_vertical = "prefix+%"
new_workspace = "prefix+shift+c"

# Direct pane cycling intentionally takes these keys from pane applications.
cycle_pane_previous = ["ctrl+h", "ctrl+k"]
cycle_pane_next = ["ctrl+j", "ctrl+l"]

# Prefix h/j/k/l are reserved for the tmux-compatible resize commands below.
focus_pane_left = ""
focus_pane_down = ""
focus_pane_up = ""
focus_pane_right = ""

swap_pane_left = "prefix+shift+h"
swap_pane_down = "prefix+shift+j"
swap_pane_up = "prefix+shift+k"
swap_pane_right = "prefix+shift+l"

[[keys.command]]
key = "prefix+h"
type = "shell"
command = '"$HERDR_BIN_PATH" pane resize --direction left --pane "$HERDR_ACTIVE_PANE_ID"'
description = "resize pane left"

[[keys.command]]
key = "prefix+l"
type = "shell"
command = '"$HERDR_BIN_PATH" pane resize --direction right --pane "$HERDR_ACTIVE_PANE_ID"'
description = "resize pane right"

[[keys.command]]
key = "prefix+k"
type = "shell"
command = '"$HERDR_BIN_PATH" pane resize --direction down --pane "$HERDR_ACTIVE_PANE_ID"'
description = "resize pane down"

[[keys.command]]
key = "prefix+j"
type = "shell"
command = '"$HERDR_BIN_PATH" pane resize --direction up --pane "$HERDR_ACTIVE_PANE_ID"'
description = "resize pane up"

# Match the tmux popup commands. Herdr starts these in the focused pane's cwd.
[[keys.command]]
key = "prefix+g"
type = "popup"
command = "lazygit"
description = "open LazyGit popup"
width = "90%"
height = "90%"

[[keys.command]]
key = "prefix+e"
type = "popup"
command = "yazi"
description = "open Yazi popup"
width = "90%"
height = "90%"

[[keys.command]]
key = "prefix+shift+t"
type = "popup"
command = 'exec "${SHELL:-/bin/zsh}"'
description = "open terminal popup"
width = "90%"
height = "90%"

[[keys.command]]
key = "prefix+shift+f"
type = "popup"
command = "zsh -ic 'file=$(fzf --preview \"bat --style=numbers --color=always {} 2>/dev/null || cat {}\"); [ -n \"$file\" ] && nvim \"$file\"'"
description = "fuzzy find and edit file"
width = "90%"
height = "90%"

[ui]
tab_bar_position = "top"
pane_borders = true
pane_gaps = false
pane_scrollbars = false
mouse_capture = true
copy_on_select = true
confirm_close = true
prompt_new_tab_name = false

[experimental]
kitty_graphics = true
