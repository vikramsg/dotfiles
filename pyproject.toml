[project]
name = "dotfiles-tools"
version = "0.1.0"
description = "Monorepo for dotfiles Python tools"
requires-python = ">=3.14"
dependencies = []

[tool.uv.workspace]
members = ["bin/screenshot_sync", "router-battery-check", "bin/ghostty_workspace"]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest",
]

[tool.pytest.ini_options]
testpaths = ["bin/screenshot_sync/tests", "bin/ghostty_workspace/tests"]
