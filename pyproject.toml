[project]
name = "dotfiles-tools"
version = "0.1.0"
description = "Monorepo for dotfiles Python tools"
requires-python = ">=3.14"
dependencies = []

[tool.uv.workspace]
members = ["router-battery-check", "bin/ghostty_workspace", "bin/screenshot", "bin/lch", "bin/ocint", "bin/gh_stats"]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest",
]

[tool.pytest.ini_options]
addopts = ["--import-mode=importlib"]
pythonpath = ["bin/screenshot", "bin/lch", "bin/gh_stats"]
testpaths = ["bin/ghostty_workspace/tests", "bin/screenshot/tests", "bin/lch/tests", "bin/ocint/tests", "bin/gh_stats/tests", "tests/unit/scripts"]
