[project]
name = "dotfiles-tools"
version = "0.1.0"
description = "Monorepo for dotfiles Python tools"
requires-python = ">=3.14"
dependencies = []

[tool.uv.workspace]
members = ["bin/screenshot", "bin/lch", "bin/opener_tunnel", "bin/gh_stats", "bin/ocost", "bin/herdr_sidebar"]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest",
]

[tool.pytest.ini_options]
addopts = ["--import-mode=importlib"]
pythonpath = ["bin/screenshot", "bin/lch", "bin/opener_tunnel", "bin/gh_stats", "bin/ocost"]
testpaths = ["bin/screenshot/tests", "bin/lch/tests", "bin/opener_tunnel/tests", "bin/gh_stats/tests", "bin/ocost/tests", "tests/unit/scripts"]
