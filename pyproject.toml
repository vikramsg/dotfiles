[project]
name = "dotfiles-tools"
version = "0.1.0"
description = "Monorepo for dotfiles Python tools"
requires-python = ">=3.14"
dependencies = []

[tool.uv.workspace]
members = ["bin/screenshot_sync", "router-battery-check", "bin/ghostty_workspace", "bin/screenshot", "bin/lch"]

[tool.uv]
package = false

[dependency-groups]
dev = [
    "pytest",
]

[tool.pytest.ini_options]
addopts = ["--import-mode=importlib"]
pythonpath = ["bin/screenshot", "bin/lch"]
testpaths = ["bin/screenshot_sync/tests", "bin/ghostty_workspace/tests", "bin/screenshot/tests", "bin/lch/tests"]
