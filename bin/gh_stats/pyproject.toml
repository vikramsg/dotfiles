[project]
name = "gh-stats"
version = "0.1.0"
description = "Summarize merged GitHub pull requests"
requires-python = ">=3.14"
dependencies = [
    "click",
    "rich",
]

[project.scripts]
gh-stats = "gh_stats.cli:main"

[build-system]
requires = ["uv_build>=0.9.26,<0.10.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = "."

[tool.pytest.ini_options]
testpaths = ["tests"]
