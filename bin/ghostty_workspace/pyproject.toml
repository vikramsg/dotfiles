[project]
name = "ghostty-workspace"
version = "0.1.0"
description = "Open configured Ghostty workspaces from TOML"
dependencies = [
    "click",
    "jinja2",
]

[project.scripts]
ghostty-workspace = "ghostty_workspace.cli:main"

[build-system]
requires = ["uv_build>=0.9.26,<0.10.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = "."

[tool.pytest.ini_options]
testpaths = ["tests"]
