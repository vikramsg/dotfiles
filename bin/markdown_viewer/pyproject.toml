[project]
name = "markdown-viewer"
version = "0.1.0"
description = "Render Markdown documents in Textual"
dependencies = [
    "click",
    "textual",
]

[project.scripts]
markdown-viewer = "markdown_viewer.cli:main"

[build-system]
requires = ["uv_build>=0.9.26,<0.10.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = "."

[tool.pytest.ini_options]
testpaths = ["tests"]
