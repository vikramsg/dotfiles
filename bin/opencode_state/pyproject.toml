[project]
name = "opencode-state"
version = "0.1.0"
description = "Local OpenCode SQLite usage and session analytics"
dependencies = [
    "click",
    "pydantic",
]

[dependency-groups]
dev = [
    "pytest",
]

[project.scripts]
opencode-state = "opencode_state.cli:main"

[build-system]
requires = ["uv_build>=0.9.26,<0.10.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = "."

[tool.pytest.ini_options]
testpaths = ["tests"]
