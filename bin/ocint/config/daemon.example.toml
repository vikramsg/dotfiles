database_path = "~/.local/state/ocint/daemon.sqlite"
mirror_root = "~/.local/share/ocint/mirrors"
worktree_root = "~/.local/share/ocint/worktrees"
idle_timeout_seconds = 60

[lifecycle]
startup_delay_seconds = 60
inactive_interval_seconds = 600

[logging]
max_bytes = 10485760
backup_count = 5

[[repositories]]
name = "repository"
description = "Repository available for daemon-managed changes."
remote_url = "git@github.com:OWNER/REPOSITORY.git"
default_branch = "main"
github_repository = "OWNER/REPOSITORY"
author_name = "ocint daemon"
author_email = "ocint@example.invalid"
actors = ["GITHUB_LOGIN"]
checks = [["just", "--justfile", "bin/ocint/justfile", "check"], ["just", "--justfile", "bin/ocint/justfile", "test"]]

[scheduler]
capacity = 2
job_timeout_seconds = 3600

[opencode]
server_url = "http://127.0.0.1:4097"
username = "opencode"
request_timeout_seconds = 30
expected_version = "1.18.15"
executable = "/usr/bin/opencode"
config_file = "~/.config/ocint/opencode-xdg/opencode/opencode.json"
xdg_config_home = "~/.config/ocint/opencode-xdg"
xdg_data_home = "~/.local/share/ocint/opencode-data"
startup_timeout_seconds = 120
shutdown_timeout_seconds = 10

[api]
host = "127.0.0.1"
port = 8732

[github]
api_url = "https://api.github.com"
issue_label = "ocint"
agent_actor = "GITHUB_LOGIN"

[coordinator]
workspace_root = "~/.local/share/ocint/coordinator"
turn_timeout_seconds = 1800
shutdown_timeout_seconds = 30
orphan_retention_seconds = 86400
retry_seconds = 5
max_turn_retries = 3
response_chunk_characters = 3500
slack_post_interval_seconds = 1

[coordinator.ingress]
host = "127.0.0.1"
port = 8733
max_request_bytes = 65536
timestamp_tolerance_seconds = 300
processing_timeout_seconds = 2.5
database_busy_timeout_ms = 2000

[coordinator.slack]
workspace_id = "T01234567"

[[coordinator.slack.channels]]
# Phase 1 channel IDs must identify public channels.
channel_id = "C01234567"
authorized_users = ["U01234567"]

[coordinator.opencode]
server_url = "http://127.0.0.1:4098"
username = "opencode"
request_timeout_seconds = 30
expected_version = "1.18.15"
executable = "/usr/bin/opencode"
config_file = "~/.config/ocint/coordinator-opencode-xdg/opencode/opencode.json"
xdg_config_home = "~/.config/ocint/coordinator-opencode-xdg"
xdg_data_home = "~/.local/share/ocint/coordinator-opencode-data"
startup_timeout_seconds = 120
shutdown_timeout_seconds = 10

[git]
ssh_executable = "/usr/bin/ssh"
identity_file = "~/.ssh/id_ed25519"
known_hosts_file = "~/.ssh/known_hosts"
