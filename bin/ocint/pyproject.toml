[project]
name = "ocint"
version = "0.1.0"
description = "OpenCode local SQLite intelligence tools"
requires-python = ">=3.14"
dependencies = [
    "aiohttp>=3.12",
    "alembic",
    "click",
    "fastapi",
    "pydantic",
    "pydantic-settings",
    "rich",
    "sqlalchemy",
    "structlog>=26.1.0",
    "uvicorn",
]

[dependency-groups]
dev = [
    "httpx",
    "pytest",
    "pytest-asyncio",
    "ruff",
    "ty",
]

[project.scripts]
ocint = "ocint.cli:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ocint"]

[tool.hatch.build.targets.sdist]
include = ["ocint", "config/opencode.daemon.json", "README.md", "pyproject.toml"]

[tool.pytest.ini_options]
addopts = ["--import-mode=importlib"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py314"
line-length = 120
src = ["ocint", "scripts", "tests"]

[tool.ruff.lint]
select = [
    "ANN",
    "ARG",
    "B",
    "C4",
    "E",
    "F",
    "I",
    "PT",
    "RUF",
    "SIM",
    "UP",
]
ignore = [
    "ANN401",
    "E501",
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
    "ARG001",
]

[tool.ty.environment]
python-version = "3.14"

[tool.ty.src]
include = ["ocint", "scripts", "tests"]

[tool.ty.rules]
all = "error"
