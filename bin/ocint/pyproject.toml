[project]
name = "ocint"
version = "0.1.0"
description = "OpenCode local SQLite intelligence tools"
requires-python = ">=3.14"
dependencies = [
    "alembic",
    "click",
    "pydantic",
    "rich",
    "sqlalchemy",
]

[dependency-groups]
dev = [
    "pytest",
    "ruff",
    "ty",
]

[project.scripts]
ocint = "ocint.cli:main"

[build-system]
requires = ["uv_build>=0.9.26,<0.10.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = "."

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
target-version = "py314"
line-length = 120
src = ["ocint", "tests"]

[tool.ruff.lint]
select = [
    "ANN",
    "ARG",
    "B",
    "C4",
    "E",
    "F",
    "I",
    "PT",
    "RUF",
    "SIM",
    "UP",
]
ignore = [
    "ANN401",
    "E501",
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = [
    "ARG001",
]

[tool.ty.environment]
python-version = "3.14"

[tool.ty.src]
include = ["ocint", "tests"]

[tool.ty.rules]
all = "error"
