[project]
name = "herdr-profile"
version = "0.1.0"
description = "Set up, open and remove Herdr app profiles"
requires-python = ">=3.14"
dependencies = ["typer>=0.15"]

[project.scripts]
herdr-profile = "herdr_profile.cli:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["pytest", "ruff", "ty"]

[tool.pytest.ini_options]
addopts = ["--import-mode=importlib"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py314"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ty.src]
include = ["herdr_profile"]

[tool.ty.rules]
all = "error"
