[project]
name = "lch"
version = "0.1.0"
description = "Thin launchd orchestrator for dotfiles jobs"
dependencies = [
    "click",
    "pydantic>=2,<3",
]

[project.scripts]
lch = "lch.cli:main"

[build-system]
requires = ["uv_build>=0.9.26,<0.10.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = "."

[tool.pytest.ini_options]
testpaths = ["tests"]
