[project]
name = "opencode-resume"
version = "0.1.0"
description = "Reopen OpenCode sessions in Herdr terminals that herdr-core restored after a restart"
requires-python = ">=3.14"
dependencies = ["click>=8.2"]

[project.scripts]
opencode-resume = "opencode_resume.cli:main"

[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[dependency-groups]
dev = ["pytest", "ruff", "ty"]

[tool.pytest.ini_options]
addopts = ["--import-mode=importlib"]
testpaths = ["tests"]

[tool.ruff]
target-version = "py314"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ty.src]
include = ["opencode_resume"]

[tool.ty.rules]
all = "error"
