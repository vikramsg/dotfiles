[project]
name = "opener-tunnel"
version = "0.1.0"
description = "Config-driven browser opener tunnel supervisor"
dependencies = [
    "click",
]

[project.scripts]
opener-tunnel = "opener_tunnel.cli:main"

[build-system]
requires = ["uv_build>=0.9.26,<0.10.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-root = "."

[tool.pytest.ini_options]
testpaths = ["tests"]
