# Ensure user and Homebrew binaries are in tmux's internal PATH for direct commands and popups.
set-environment -g -F PATH "#{E:HOME}/.local/bin:/opt/homebrew/bin:/home/linuxbrew/.linuxbrew/bin:/usr/local/bin:/bin:/usr/bin"
set -g default-shell /bin/zsh

# Add c + space also as prefix while C-b continues to work
# Note: On macOS, if Ctrl+Space doesn't work, ensure it's not being intercepted by the OS.
# Check System Settings -> Keyboard -> Keyboard Shortcuts -> Input Sources
# and disable "Select the previous input source" if it's bound to ^Space.
set -g prefix C-Space
set -g prefix2 C-b
bind C-Space send-prefix

# Enable mouse for resizing pane and copy paste
set -g mouse on

# Set copy mode keys to be vim keys
setw -g mode-keys vi

# Start windows and panes at 1, not 0
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set -g renumber-windows on

# Enable OSC52 clipboard support (for remote VM copy-paste)
set -g set-clipboard on
# Allow passthrough for OSC52 clipboard sequences
set -g allow-passthrough on

# Ensure SSH agent forwarding works when reattaching to a session
set -g update-environment "SSH_AUTH_SOCK"
# Preserve terminal detection so Yazi can select the correct image protocol
set -ga update-environment TERM
set -ga update-environment TERM_PROGRAM

# Enabling this ensures Neovim knows when you switch back to it, allowing it to automatically reload files changed outside the editor
set -g focus-events on

# List of plugins
# TPM (Tmux Plugin Manager) - the plugin manager itself
set -g @plugin 'tmux-plugins/tpm'
# Sensible defaults for tmux (increases scrollback, enables focus events, aggressive resize, fixes escape key delay, etc.)
set -g @plugin 'tmux-plugins/tmux-sensible'
# Save and restore tmux sessions across system restarts
set -g @plugin 'tmux-plugins/tmux-resurrect'
# Automatic continuous saving and restoring of tmux sessions
set -g @plugin 'tmux-plugins/tmux-continuum'

# ==========================================
# 1. Aesthetic Plugin (Catppuccin)
# ==========================================
set -g @plugin 'catppuccin/tmux#v2.1.2'
set -g @catppuccin_flavor 'mocha'

# Configure the visual style of the modules
set -g @catppuccin_window_status_style "rounded"
set -g @catppuccin_window_text " #W"
# Add an indicator that we are currently zoomed in
set -g @catppuccin_window_current_text " #{?window_zoomed_flag,󰁌 ,}#W"

set -g @catppuccin_pane_active_border_style "fg=#{@thm_blue}"
set -g @catppuccin_pane_border_style "fg=#{@thm_surface_0}"
set -g pane-border-lines heavy
set -g pane-border-status top
set -g pane-border-format ""

# Neovim and other CLI tools show colors exactly as intended, especially inside Ghostty
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",*:RGB"
# Preserve modified keys such as Shift+Enter for terminal applications.
set -s extended-keys on

# ==========================================
# 2. Layout (The "Where")
# ==========================================
set -g status-position top

# -- Left: Open Windows --
set -g status-justify left
set -g status-left-length 100
set -g status-left ""

# -- Center & Right: Session, Directory, Gitmux & Battery --
set -g status-right-length 150
# Battery check logic: Try macOS `pmset` first. If it fails (2>/dev/null hides errors), try reading Linux `sysfs` battery capacity.
set -g status-right "#[fg=#f9e2af,bold]#{?client_prefix,󰘳 PREFIX  ,}#[fg=#f38ba8,bold] #(gitmux -timeout 200ms #{pane_current_path}) #[fg=#a6e3a1,bg=default]   #(pmset -g batt 2>/dev/null | grep -o '[0-9]\\+%%' || cat /sys/class/power_supply/BAT0/capacity 2>/dev/null | awk '{print $1\"%%\"}') #[align=absolute-centre]#[fg=#cba6f7,bg=default,bold] #S #[fg=#89b4fa,bg=default,nobold]  #{s|$HOME|~|;s|.*/([^/]+/[^/]+)$|…/\\1|:pane_current_path} "

# Tmux + nvim navigation made easy
# Navigate seamlessly between tmux panes and vim splits
set -g @plugin 'christoomey/vim-tmux-navigator'

# Enable automatic session restoration on tmux start
set -g @continuum-restore 'on'
# Enable continuum to start on system boot
set -g @continuum-boot 'on'
# Configure resurrect to save/restore vim sessions
set -g @resurrect-strategy-vim 'session'

# Set continuum to auto-save sessions every 15 minutes
set -g @continuum-save-interval '15'

# Other examples:
# set -g @plugin 'github_username/plugin_name'
# set -g @plugin 'git@github.com:user/plugin'
# set -g @plugin 'git@bitbucket.com:user/plugin'

# Use Prefix + h/j/k/l to resize panes
bind -r h resize-pane -L 5
bind -r l resize-pane -R 5
bind -r k resize-pane -D 5
bind -r j resize-pane -U 5

# Use vim keys for copying in tmux copy mode
bind -T copy-mode-vi v send -X begin-selection
# Note: `pbcopy` is a macOS command. On Linux, this specific command will fail silently in the background.
# However, copy/paste still works seamlessly on Linux because we have OSC52 enabled (`set -g set-clipboard on`).
# Tmux intercepts the yank and sends the OSC52 sequence to the terminal emulator, bypassing the local command.
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"
bind P paste-buffer
bind -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-and-cancel "pbcopy"

# Open new horizontal splits in the current pane's directory
bind '"' split-window -v -c "#{pane_current_path}"
# Open new horizontal splits above the current pane's directory
bind "'" split-window -vb -c "#{pane_current_path}"
# Open new vertical splits in the current pane's directory
bind % split-window -h -c "#{pane_current_path}"
# Open new windows in the current pane's directory
bind c new-window -c "#{pane_current_path}"

# Default floating pane configuration (90% width/height, centered)
set -s command-alias[100] 'float=new-pane -x 90% -y 90% -X 5% -Y 5%'

# Open LazyGit in a floating pane rooted at the current pane's directory
bind -N "Open LazyGit floating pane" g float -c "#{pane_current_path}" lazygit

# Open Yazi in a floating pane rooted at the current pane's directory
bind -N "Open Yazi floating pane" e float -c "#{pane_current_path}" yazi

# Pick and watch a Markdown file in a floating pane
bind -N "Open Markdown preview" v float -c "#{pane_current_path}" leaf --watch

# Open a floating terminal in current directory
# Close the terminal using ctl + d
bind -N "Open floating terminal" T float -c "#{pane_current_path}"

# Fuzzy find and edit file in a floating pane
bind -N "Fuzzy find and edit file" F float -c "#{pane_current_path}" zsh -ic 'file=$(fzf --preview "bat --style=numbers --color=always {} 2>/dev/null || cat {}"); [ -n "$file" ] && nvim "$file"'

# Create new session from inside tmux
bind C command-prompt -p "New Session:" "new-session -A -s '%%'"

# Move current window to a new session and switch to it
bind M command-prompt -p "Move window to session:" "run-shell \"if tmux has-session -t '%1' 2>/dev/null; then tmux move-window -s '#{window_id}' -t '%1:'; else tmux new-session -d -s '%1' -c '#{pane_current_path}'; tmux move-window -s '#{window_id}' -t '%1:'; tmux kill-window -t '%1:1'; fi; tmux switch-client -t '%1'; tmux select-window -t '#{window_id}'\""

# Change session's working directory to current pane's path
bind W attach-session -c "#{pane_current_path}"

# Use q to reload configuration rather than doing tmux source everytime
bind q source-file ~/.config/tmux/tmux.conf

# Use Prefix + H/J/K/L to swap panes directionally
# This works by selecting the target pane spatially, swapping with the previously active pane, and moving focus back
bind H run-shell 'old=`tmux display -p "#{pane_index}"`; tmux select-pane -L; tmux swap-pane -t $old'
bind J run-shell 'old=`tmux display -p "#{pane_index}"`; tmux select-pane -D; tmux swap-pane -t $old'
bind K run-shell 'old=`tmux display -p "#{pane_index}"`; tmux select-pane -U; tmux swap-pane -t $old'
bind L run-shell 'old=`tmux display -p "#{pane_index}"`; tmux select-pane -R; tmux swap-pane -t $old'

# Initialize TMUX plugin manager (keep this line at the very bottom of tmux.conf)
set-environment -g TMUX_PLUGIN_MANAGER_PATH '~/.tmux/plugins/'
run '~/.tmux/plugins/tpm/tpm'
