os:
  openLink: 'xdg-open {{link}}'
  # We do not use the built-in editPreset: 'nvim-remote' here because it forcefully exits the lazygit 
  # process by sending "q" which triggers the lazygit.nvim on_exit callback, stealing focus back to 
  # the old buffer. Instead, we use a custom edit command that leaves the lazygit terminal process 
  # running in the background and only uses <C-\><C-n>:q<CR> to close the floating terminal window.
  edit: '[ -z "$NVIM" ] && (nvim -- {{filename}}) || (nvim --server "$NVIM" --remote-send ''<C-\><C-n>:q<CR>'' && nvim --server "$NVIM" --remote {{filename}})'
  editAtLine: '[ -z "$NVIM" ] && (nvim +{{line}} -- {{filename}}) || (nvim --server "$NVIM" --remote-send ''<C-\><C-n>:q<CR>'' && nvim --server "$NVIM" --remote {{filename}} && nvim --server "$NVIM" --remote-send ":{{line}}<CR>")'
  editAtLineAndWait: '[ -z "$NVIM" ] && (nvim +{{line}} -- {{filename}}) || (nvim --server "$NVIM" --remote-send ''<C-\><C-n>:q<CR>'' && nvim --server "$NVIM" --remote {{filename}} && nvim --server "$NVIM" --remote-send ":{{line}}<CR>")'

gui:
  wrapLinesInStagingView: true
  splitDiff: 'auto'
  sidePanelWidth: 0.2

git:
  diffContextSize: 5
  pagers:
    # Use delta with a custom syntax-theme to remove blocky high-contrast ANSI colors, applying subtle hex background colors instead.
    - pager: >-
        delta --dark --paging=never --side-by-side --line-numbers --syntax-theme=Dracula --minus-style='syntax #3f0001' --minus-emph-style='syntax #780000' --plus-style='syntax #003800' --plus-emph-style='syntax #007300' --hyperlinks --hyperlinks-file-link-format="lazygit-edit://{path}:{line}"

customCommands:
  - key: '<c-g>'
    context: 'files'
    description: 'Full-screen diff of selected file'
    # Passes identical delta style arguments inline so full-screen mode matches the inner UI style
    command: >-
      clear && git -c core.pager="delta --paging=always --dark --side-by-side --line-numbers --syntax-theme=Dracula --minus-style='syntax #3f0001' --minus-emph-style='syntax #780000' --plus-style='syntax #003800' --plus-emph-style='syntax #007300'" diff HEAD -- {{.SelectedFile.Name | quote}}
    output: terminal
  - key: '<c-g>'
    context: 'commits'
    description: 'Full-screen diff of selected commit'
    # Passes identical delta style arguments inline so full-screen mode matches the inner UI style
    command: >-
      clear && git -c core.pager="delta --paging=always --dark --side-by-side --line-numbers --syntax-theme=Dracula --minus-style='syntax #3f0001' --minus-emph-style='syntax #780000' --plus-style='syntax #003800' --plus-emph-style='syntax #007300'" show {{.SelectedLocalCommit.Sha}}
    output: terminal
