os:
  open: '[ "$(uname)" = "Darwin" ] && open {{filename}} || xdg-open {{filename}}'
  openLink: '[ "$(uname)" = "Darwin" ] && open {{link}} || xdg-open {{link}}'
  copyToClipboardCmd: >-
    printf '\033]52;c;%s\a' "$(printf %s {{text}} | base64 | tr -d '\n')" > /dev/tty
  # We do not use the built-in editPreset: 'nvim-remote' here because it forcefully exits the lazygit 
  # process by sending "q" which triggers the lazygit.nvim on_exit callback, stealing focus back to 
  # the old buffer. Instead, we use a custom edit command that leaves the lazygit terminal process 
  # running in the background and only uses <C-\><C-n>:q<CR> to close the floating terminal window.
  edit: '[ -z "$NVIM" ] && (nvim -- {{filename}}) || (nvim --server "$NVIM" --remote-send ''<C-\><C-n>:q<CR>'' && nvim --server "$NVIM" --remote {{filename}})'
  editAtLine: '[ -z "$NVIM" ] && (nvim +{{line}} -- {{filename}}) || (nvim --server "$NVIM" --remote-send ''<C-\><C-n>:q<CR>'' && nvim --server "$NVIM" --remote {{filename}} && nvim --server "$NVIM" --remote-send ":{{line}}<CR>")'
  editAtLineAndWait: '[ -z "$NVIM" ] && (nvim +{{line}} -- {{filename}}) || (nvim --server "$NVIM" --remote-send ''<C-\><C-n>:q<CR>'' && nvim --server "$NVIM" --remote {{filename}} && nvim --server "$NVIM" --remote-send ":{{line}}<CR>")'

gui:
  border: rounded
  showCommandLog: false
  showRandomTip: false
  nerdFontsVersion: "3"
  showFileIcons: true
  wrapLinesInStagingView: true
  splitDiff: auto
  sidePanelWidth: 0.22
  # TokyoNight Night theme (matches Neovim colorscheme)
  theme:
    activeBorderColor:
      - '#ff9e64'
      - bold
    inactiveBorderColor:
      - '#27a1b9'
    searchingActiveBorderColor:
      - '#ff9e64'
      - bold
    optionsTextColor:
      - '#7aa2f7'
    selectedLineBgColor:
      - '#283457'
    inactiveViewSelectedLineBgColor:
      - '#1f2335'
    cherryPickedCommitFgColor:
      - '#7aa2f7'
    cherryPickedCommitBgColor:
      - '#bb9af7'
    markedBaseCommitFgColor:
      - '#7aa2f7'
    markedBaseCommitBgColor:
      - '#e0af68'
    unstagedChangesColor:
      - '#db4b4b'
    defaultFgColor:
      - '#c0caf5'
  authorColors:
    '*': '#bb9af7'

git:
  diffContextSize: 5
  paging:
    colorArg: always
    pager: delta --dark --paging=never --side-by-side --line-numbers --syntax-theme=base16-256 --minus-style='syntax #4a272f' --minus-emph-style='syntax #713137' --plus-style='syntax #243e4a' --plus-emph-style='syntax #2c5a66' --line-numbers-minus-style='#914c54' --line-numbers-plus-style='#449dab' --line-numbers-zero-style='#3b4261' --hyperlinks --hyperlinks-file-link-format="lazygit-edit://{path}:{line}"
  diffRenderers:
    - command: >-
        delta --dark --paging=never --side-by-side --line-numbers --syntax-theme=base16-256 --minus-style='syntax #4a272f' --minus-emph-style='syntax #713137' --plus-style='syntax #243e4a' --plus-emph-style='syntax #2c5a66' --line-numbers-minus-style='#914c54' --line-numbers-plus-style='#449dab' --line-numbers-zero-style='#3b4261' --hyperlinks --hyperlinks-file-link-format="lazygit-edit://{path}:{line}"

keybinding:
  universal:
    copyToClipboard: 'y'

customCommands:
  - key: '<c-y>'
    context: 'global'
    description: 'Select file to diff against main'
    prompts:
      - type: 'menuFromCommand'
        title: 'Files changed against main'
        key: 'File'
        command: 'git diff --name-only main'
        filter: '(?P<file>.+)'
        valueFormat: '{{ .file }}'
        labelFormat: '{{ .file }}'
    command: >-
      clear && git -c core.pager="delta --paging=always --dark --side-by-side --line-numbers --syntax-theme=base16-256 --minus-style='syntax #4a272f' --minus-emph-style='syntax #713137' --plus-style='syntax #243e4a' --plus-emph-style='syntax #2c5a66' --line-numbers-minus-style='#914c54' --line-numbers-plus-style='#449dab' --line-numbers-zero-style='#3b4261'" diff main -- {{.Form.File | quote}}
    output: terminal
  - key: '<c-g>'
    context: 'files'
    description: 'Full-screen diff of selected file'
    command: >-
      clear && git -c core.pager="delta --paging=always --dark --side-by-side --line-numbers --syntax-theme=base16-256 --minus-style='syntax #4a272f' --minus-emph-style='syntax #713137' --plus-style='syntax #243e4a' --plus-emph-style='syntax #2c5a66' --line-numbers-minus-style='#914c54' --line-numbers-plus-style='#449dab' --line-numbers-zero-style='#3b4261'" diff HEAD -- {{.SelectedFile.Name | quote}}
    output: terminal
  - key: '<c-g>'
    context: 'commits'
    description: 'Full-screen diff of selected commit'
    command: >-
      clear && git -c core.pager="delta --paging=always --dark --side-by-side --line-numbers --syntax-theme=base16-256 --minus-style='syntax #4a272f' --minus-emph-style='syntax #713137' --plus-style='syntax #243e4a' --plus-emph-style='syntax #2c5a66' --line-numbers-minus-style='#914c54' --line-numbers-plus-style='#449dab' --line-numbers-zero-style='#3b4261'" show {{.SelectedLocalCommit.Sha}}
    output: terminal
