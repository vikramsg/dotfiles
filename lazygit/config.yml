os:
  openLink: 'xdg-open {{link}}'
  # We do not use the built-in editPreset: 'nvim-remote' here because it forcefully exits the lazygit 
  # process by sending "q" which triggers the lazygit.nvim on_exit callback, stealing focus back to 
  # the old buffer. Instead, we use a custom edit command that leaves the lazygit terminal process 
  # running in the background and only uses <C-\><C-n>:q<CR> to close the floating terminal window.
  edit: '[ -z "$NVIM" ] && (nvim -- {{filename}}) || (nvim --server "$NVIM" --remote-send ''<C-\><C-n>:q<CR>'' && nvim --server "$NVIM" --remote {{filename}})'
  editAtLine: '[ -z "$NVIM" ] && (nvim +{{line}} -- {{filename}}) || (nvim --server "$NVIM" --remote-send ''<C-\><C-n>:q<CR>'' && nvim --server "$NVIM" --remote {{filename}} && nvim --server "$NVIM" --remote-send ":{{line}}<CR>")'
  editAtLineAndWait: '[ -z "$NVIM" ] && (nvim +{{line}} -- {{filename}}) || (nvim --server "$NVIM" --remote-send ''<C-\><C-n>:q<CR>'' && nvim --server "$NVIM" --remote {{filename}} && nvim --server "$NVIM" --remote-send ":{{line}}<CR>")'
gui:
  wrapLinesInStagingView: true
  splitDiff: 'auto'
  sidePanelWidth: 0.2
  theme:
    activeBorderColor:
      - '#89b4fa'
      - bold
    inactiveBorderColor:
      - '#a6adc8'
    searchingActiveBorderColor:
      - '#f9e2af'
    optionsTextColor:
      - '#89b4fa'
    selectedLineBgColor:
      - '#313244'
    inactiveViewSelectedLineBgColor:
      - '#45475a'
    cherryPickedCommitFgColor:
      - '#89b4fa'
    cherryPickedCommitBgColor:
      - '#45475a'
    markedBaseCommitFgColor:
      - '#89b4fa'
    markedBaseCommitBgColor:
      - '#f9e2af'
    unstagedChangesColor:
      - '#f38ba8'
    defaultFgColor:
      - '#cdd6f4'
  authorColors:
    '*': '#b4befe'
git:
  diffContextSize: 5
  diffRenderers:
    # Use delta with Catppuccin Mocha syntax-theme and subtle diff highlights
    - command: >-
        delta --dark --paging=never --side-by-side --line-numbers --syntax-theme="Catppuccin Mocha" --minus-style='syntax #493447' --minus-emph-style='bold syntax #694559' --plus-style='syntax #394545' --plus-emph-style='bold syntax #4e6356' --hyperlinks --hyperlinks-file-link-format="lazygit-edit://{path}:{line}"
customCommands:
  - key: '<c-y>'
    context: 'global'
    description: 'Select file to diff against main'
    prompts:
      - type: 'menuFromCommand'
        title: 'Files changed against main'
        key: 'File'
        command: 'git diff --name-only main'
        filter: '(?P<file>.+)'
        valueFormat: '{{ .file }}'
        labelFormat: '{{ .file }}'
    # Uses the same delta styling as the existing full-screen diff, but compares against main.
    command: >-
      clear && git -c core.pager="delta --paging=always --dark --side-by-side --line-numbers --syntax-theme=\"Catppuccin Mocha\" --minus-style='syntax #493447' --minus-emph-style='bold syntax #694559' --plus-style='syntax #394545' --plus-emph-style='bold syntax #4e6356'" diff main -- {{.Form.File | quote}}
    output: terminal
  - key: '<c-g>'
    context: 'files'
    description: 'Full-screen diff of selected file'
    # Passes identical delta style arguments inline so full-screen mode matches the inner UI style
    command: >-
      clear && git -c core.pager="delta --paging=always --dark --side-by-side --line-numbers --syntax-theme=\"Catppuccin Mocha\" --minus-style='syntax #493447' --minus-emph-style='bold syntax #694559' --plus-style='syntax #394545' --plus-emph-style='bold syntax #4e6356'" diff HEAD -- {{.SelectedFile.Name | quote}}
    output: terminal
  - key: '<c-g>'
    context: 'commits'
    description: 'Full-screen diff of selected commit'
    # Passes identical delta style arguments inline so full-screen mode matches the inner UI style
    command: >-
      clear && git -c core.pager="delta --paging=always --dark --side-by-side --line-numbers --syntax-theme=\"Catppuccin Mocha\" --minus-style='syntax #493447' --minus-emph-style='bold syntax #694559' --plus-style='syntax #394545' --plus-emph-style='bold syntax #4e6356'" show {{.SelectedLocalCommit.Sha}}
    output: terminal
