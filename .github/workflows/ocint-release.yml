name: ocint release

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, edited, ready_for_review]
  push:
    branches: [main]

jobs:
  release-validation:
    name: Release validation
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha }}
      - name: Validate release PR when applicable
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          PR_HEAD_REF: ${{ github.head_ref }}
          PR_TITLE: ${{ github.event.pull_request.title }}
        run: |
          set -euo pipefail
          validator="$RUNNER_TEMP/ocint_release.py"
          if ! git cat-file -e "$BASE_SHA:bin/ocint/scripts/ocint_release.py" 2>/dev/null; then
            # One-time bootstrap: release changes are forbidden until the trusted validator is on main.
            shopt -s nocasematch
            if [[ "$PR_HEAD_REF" == ocint-release/* || "$PR_TITLE" =~ ^ocint:[[:space:]]*release([[:space:]]|$) ]]; then
              echo "The release validator must be merged before the first release PR" >&2
              exit 1
            fi
            if git diff --name-only "$BASE_SHA...HEAD" | grep -Fxq bin/ocint/CHANGELOG.md; then
              echo "The bootstrap PR must not create an ocint changelog" >&2
              exit 1
            fi
            base_version="$(git show "$BASE_SHA:bin/ocint/pyproject.toml" | python3 -c 'import sys, tomllib; print(tomllib.load(sys.stdin.buffer)["project"]["version"])')"
            head_version="$(python3 -c 'import tomllib; print(tomllib.load(open("bin/ocint/pyproject.toml", "rb"))["project"]["version"])')"
            if [[ "$base_version" != "$head_version" ]]; then
              echo "The bootstrap PR must not change the ocint version" >&2
              exit 1
            fi
            echo "Release validation is not applicable to the validator bootstrap PR"
            exit 0
          fi
          git show "$BASE_SHA:bin/ocint/scripts/ocint_release.py" > "$validator"
          python "$validator" --root "$GITHUB_WORKSPACE" validate-pr \
            --base "$BASE_SHA" --base-ref "$BASE_REF" --title "$PR_TITLE" --branch "$PR_HEAD_REF"

  tag-merged-release:
    name: Tag merged release
    if: github.event_name == 'push'
    concurrency:
      group: ocint-release-tags
      cancel-in-progress: false
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          fetch-depth: 0
      - name: Run trusted merged-release tagger when applicable
        run: |
          set -euo pipefail
          subject="$(git log -1 --format=%s)"
          if [[ "$subject" =~ ^ocint:\ Release\ v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)(\ \(#[1-9][0-9]*\))?$ ]]; then
            parent="$(git rev-parse HEAD^)"
            validator="$RUNNER_TEMP/ocint_release.py"
            git show "$parent:bin/ocint/scripts/ocint_release.py" > "$validator"
            python "$validator" --root "$GITHUB_WORKSPACE" ci-tag
            exit 0
          fi
          shopt -s nocasematch
          if [[ "$subject" =~ ^ocint:[[:space:]]*release([[:space:]]*$|[[:space:]]+v|[[:space:]]+[0-9]) ]]; then
            echo "Malformed ocint release commit subject: $subject" >&2
            exit 1
          fi
          echo "Current main commit is not an ocint release; no tag needed"
