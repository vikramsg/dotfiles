# Prefix used for native service labels.
namespace = "com.vikramsg.dotfiles"

[services.lch-opener-tunnel]
# Command services replace `lch run` with the configured foreground command.
# The command inherits launchd lifecycle and stdout/stderr directly.
command = ["opener-tunnel", "run"]

[services.lch-zwm]
# Command services replace `lch run` with the configured foreground command.
# The command inherits launchd lifecycle and stdout/stderr directly.
command = ["zwm", "daemon"]

# macOS application services launch through LaunchServices so the signed bundle
# keeps its TCC identity. LCH waits for the app, routes its stdout/stderr to the
# normal service logs, and terminates the app when the service stops.
[services.lch-macflow.application]
type = "macos"
path = "~/Applications/Macflow.app"

